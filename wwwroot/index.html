<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Malabanan_Portfolio</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Malabanan_Portfolio.styles.css" rel="stylesheet" />

    <script src="js/windowfunctions.js"></script>
    <script type="text/javascript" async src="//cdn.credly.com/assets/utilities/embed.js"></script>
</head>

<body>
    <div id="app">
        <div class="portfolio-loader flex flex-col">
            <div class="title">
                Loading Portfolio...
            </div>

            <div class="step delay1">
                ▶ Preparing Main Quest...
            </div>

            <div class="step delay2">
                ✓ Experience Loaded
            </div>

            <div class="step delay3">
                ✓ Skills Loaded
            </div>

            <div class="step delay4">
                ✓ Projects Loaded
            </div>

            <div class="step delay5">
                ✓ Achievements Loaded
            </div>

            <div class="step delay6">
                ✓ Certifications Loaded
            </div>

            <div class="tip delay7">
                Tip:
                <br>
                "Every project taught me something new."
            </div>
        </div>

    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>

</html>
