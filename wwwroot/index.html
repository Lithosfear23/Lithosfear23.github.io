<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Malabanan_Portfolio</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Malabanan_Portfolio.styles.css" rel="stylesheet" />

    <script src="js/windowfunctions.js"></script>
    <script type="text/javascript" async src="//cdn.credly.com/assets/utilities/embed.js"></script>
</head>

<body>
    <div id="app">
        <div class="portfolio-loader flex flex-col">
            <div class="title">
                Loading Portfolio<span class="cursor">█</span>
            </div>

            <div class="step delay1">
                ▶ Preparing Hero <span class="spinner"></span>
            </div>

            <div class="step delay2">
                ✓ Experience Loaded
            </div>

            <div class="step delay3">
                ✓ Skills Loaded
            </div>

            <div class="step delay4">
                ✓ Projects Loaded
            </div>

            <div class="step delay5">
                ✓ Achievements Loaded
            </div>

            <div class="step delay6">
                ✓ Certifications Loaded
            </div>

            <div class="tip delay7">
                Tip:
                <br>
                <div id="tiptext"></div>
            </div>
        </div>

    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>

    <script>

        const lastStep = document.querySelector(".delay7");

        let started = false;

        const loader = document.querySelector(".portfolio-loader");

        const tip = document.getElementById("tiptext");

        const tips = [
            "Every project teaches me something new.",
            "Experience is earned one project at a time.",
            "Clean code is written for people first, computers second.",
            "Every bug defeated grants bonus experience.",
            "Progress is made one commit at a time.",
            "Achievement Unlocked: Continuous Learning.",
            "Started with Python. Now building full-stack applications.",
            "Side quests often teach the best lessons.",
            "Learning never stops in software development.",
            "The next level starts outside your comfort zone."
        ];

        tip.textContent = tips[Math.floor(Math.random() * tips.length)];

        lastStep.addEventListener("animationend", async () => {

            if (started) return;
            started = true;

            await new Promise(resolve => setTimeout(resolve, 600));

            loader.classList.add("fade-out");

            await new Promise(resolve => setTimeout(resolve, 400));

            await Blazor.start();

        });

    </script>

</body>

</html>
